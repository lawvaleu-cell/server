services:
  - type: web
    name: legal-library-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_BRANCH
        value: main
      - key: LIBRARY_PATH
        value: data/library.json
      - key: ALLOWED_ORIGIN
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
